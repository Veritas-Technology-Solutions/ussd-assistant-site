<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate USSDAssistant</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 400px; margin: 50px auto; padding: 20px;
            background: #f8fafc; color: #1e293b;
        }
        h2 { color: #28a745; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-weight: 600; cursor: pointer; }
        button:hover { background: #218838; }
        #result { margin-top: 20px; font-size: 1.5rem; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <h2>Activate USSDAssistant</h2>
    <p>Enter the Device ID shown in your app.</p>
    <input type="text" id="deviceId" placeholder="Device ID" />
    <button onclick="generateKey()">Get Product Key</button>
    <div id="result"></div>

    <script>
        // The same salt used in the app's LicenseManager.kt
        const SECRET_SALT = "Veritas2026USSDAssistant!";

        async function generateKey() {
            const deviceId = document.getElementById("deviceId").value.trim();
            if (!deviceId) {
                document.getElementById("result").innerText = "Please enter a Device ID.";
                return;
            }

            // SHA‑256 via Web Crypto API
            const message = `${deviceId}-${SECRET_SALT}`;
            const encoder = new TextEncoder();
            const data = encoder.encode(message);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            const key = hashHex.substring(0, 6).toUpperCase();

            document.getElementById("result").innerText = "Your product key: " + key;
        }
    </script>
</body>
</html>
