<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate USSDAssistant</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 400px; margin: 50px auto; padding: 20px;
            background: #f8fafc; color: #1e293b;
        }
        h2 { color: #28a745; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-weight: 600; cursor: pointer; }
        button:hover { background: #218838; }
        #result { margin-top: 20px; font-size: 1.5rem; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <h2>Activate USSDAssistant</h2>
    <p>After paying via M‑Pesa, enter the Device ID shown in your app to get your product key instantly.</p>
    <input type="text" id="deviceId" placeholder="Device ID (copy from app)" />
    <button onclick="generateKey()">Get Product Key</button>
    <div id="result"></div>

    <script>
        // Replace with your actual Worker URL
        const WORKER_URL = "https://ussd-activation.mugomania.workers.dev";

        async function generateKey() {
            const deviceId = document.getElementById("deviceId").value.trim();
            if (!deviceId) {
                document.getElementById("result").innerText = "Please enter your Device ID.";
                return;
            }
            try {
                const response = await fetch(`${WORKER_URL}?deviceId=${encodeURIComponent(deviceId)}`);
                const data = await response.json();
                if (data.key) {
                    document.getElementById("result").innerText = "Your product key: " + data.key;
                } else {
                    document.getElementById("result").innerText = "Error generating key. Make sure you paid and the Device ID is correct.";
                }
            } catch (err) {
                document.getElementById("result").innerText = "Network error – please try again.";
            }
        }
    </script>
</body>
</html>
