<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate USSDAssistant</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 400px; margin: 50px auto; padding: 20px;
            background: #f8fafc; color: #1e293b;
        }
        h2 { color: #28a745; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-weight: 600; cursor: pointer; }
        button:hover { background: #218838; }
        #result { margin-top: 20px; font-size: 1.5rem; font-weight: bold; text-align: center; }
        #debug { margin-top: 10px; font-size: 0.8rem; color: #666; word-break: break-all; }
    </style>
</head>
<body>
    <h2>Activate USSDAssistant</h2>
    <p>Enter the Device ID shown in your app.</p>
    <input type="text" id="deviceId" placeholder="Device ID" />
    <button onclick="generateKey()">Get Product Key</button>
    <div id="result"></div>
    <div id="debug"></div>

    <script>
        // Replace with your Worker URL if different
        const WORKER_URL = "https://ussd-activation.mugomania.workers.dev";

        async function generateKey() {
            const deviceId = document.getElementById("deviceId").value.trim();
            if (!deviceId) {
                document.getElementById("result").innerText = "Please enter a Device ID.";
                return;
            }

            const debugDiv = document.getElementById("debug");
            debugDiv.innerText = "Fetching...";

            try {
                const response = await fetch(`${WORKER_URL}?deviceId=${encodeURIComponent(deviceId)}`);
                debugDiv.innerText = `Status: ${response.status} ${response.statusText}`;

                if (!response.ok) {
                    document.getElementById("result").innerText = `Server error (${response.status}). Please try again.`;
                    return;
                }

                const data = await response.json();
                debugDiv.innerText += "\nResponse: " + JSON.stringify(data);

                if (data.key) {
                    document.getElementById("result").innerText = "Your product key: " + data.key;
                } else {
                    document.getElementById("result").innerText = "Error: " + (data.error || "Unknown error");
                }
            } catch (err) {
                debugDiv.innerText += "\nError: " + err.message;
                document.getElementById("result").innerText = "Network error – please try again.";
            }
        }
    </script>
</body>
</html>
